name: Repair current architecture
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch current architecture
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8'); changed=False
              for old,new in pairs:
                  if old in s:
                      s=s.replace(old,new,1); changed=True
              if changed: p.write_text(s,encoding='utf-8')
          patch('src/components/ChatWorkspace.tsx', [
            ("agentIds:['manager','research'] },{ id:'room-study-research',categoryId:'study',name:'研究討論',description:'論文、文獻與研究問題',agentIds:['manager','study'] }", "agentIds:['manager','study'] },{ id:'room-study-research',categoryId:'study',name:'研究討論',description:'一般研究學習討論',agentIds:['manager','study'] }"),
            ("const [categories,setCategories]=useState<ChatCategory[]>(()=>readList<ChatCategory>(CATEGORY_KEY,defaultCategories)); const [rooms,setRooms]=useState<ChatRoom[]>(()=>readList<ChatRoom>(ROOM_KEY,defaultRooms).map(room=>room.categoryId==='research'?{...room,categoryId:'study'}:room));", "const [categories,setCategories]=useState<ChatCategory[]>(()=>readList<ChatCategory>(CATEGORY_KEY,defaultCategories)); const [rooms,setRooms]=useState<ChatRoom[]>(()=>readList<ChatRoom>(ROOM_KEY,defaultRooms).map(room=>room.categoryId==='research'?{...room,agentIds:['manager','research']}:room));"),
            ("const existingCategory=categories.find(c=>c.id==='research'||c.name==='論文研究'||c.id.startsWith('research-')); if(existingCategory){const existingRoom=rooms.find(r=>r.categoryId===existingCategory.id); if(existingRoom){setSelectedRoomId(existingRoom.id);setRoomMessages(readMessages(existingRoom.id,[]));return existingRoom;}}\n  const categoryId='research'; const roomId=`room-research-${Date.now()}`;", "const existingCategory=categories.find(c=>c.id==='research'||c.name==='論文研究'||c.id.startsWith('research-')); if(existingCategory){const existingRoom=rooms.find(r=>r.categoryId===existingCategory.id); if(existingRoom){setSelectedRoomId(existingRoom.id);setRoomMessages(readMessages(existingRoom.id,[]));return existingRoom;} const roomId=`room-research-${Date.now()}`; const room:ChatRoom={id:roomId,categoryId:existingCategory.id,name:'論文研究',description:'專門管理論文、文獻、研究方法、統計分析與研究進度',agentIds:['manager','research']}; setRooms(prev=>[...prev,room]); setCollapsed(prev=>({...prev,[existingCategory.id]:false})); setSelectedRoomId(roomId); setRoomMessages([]); return room;}\n  const categoryId='research'; const roomId=`room-research-${Date.now()}`;"),
            ("agentIds:['manager','study']}; setCategories", "agentIds:['manager','research']}; setCategories"),
          ])
          patch('server/directAgentChat.ts', [
            ("const studyPrompt = buildBasePrompt(AGENTS.study, routing, executionLabel, { studySubjects, studyTasks }, selectedTaskIds.filter(id => studyTasks.some(t => String(t.id) === id)), safeHistory) + `\\n\\n【專業委派】\\n${commonRules}\\n你現在只負責課業／研究領域。`;\n      const [workResult, studyResult] = await Promise.all([callGemini(client, workPrompt, prompt), callGemini(client, studyPrompt, prompt)]);\n      specialistResults = { work: workResult, study: studyResult };", "const researchPrompt = buildBasePrompt(AGENTS.research, routing, executionLabel, { workProjects, studySubjects }, [], safeHistory) + `\\n\\n【專業委派】\\n${commonRules}\\n你現在只負責論文、文獻、研究方法與研究資料分析。`;\n      const secondSpecialist = routing.delegatedAgents.includes('research') ? researchPrompt : buildBasePrompt(AGENTS.study, routing, executionLabel, { studySubjects, studyTasks }, selectedTaskIds.filter(id => studyTasks.some(t => String(t.id) === id)), safeHistory) + `\\n\\n【專業委派】\\n${commonRules}\\n你現在只負責課業領域。`;\n      const [workResult, secondResult] = await Promise.all([callGemini(client, workPrompt, prompt), callGemini(client, secondSpecialist, prompt)]);\n      specialistResults = routing.delegatedAgents.includes('research') ? { work: workResult, research: secondResult } : { work: workResult, study: secondResult };"),
            ("Owner 的需求同時涉及工作與課業。", "Owner 的需求同時涉及工作與課業或研究。"),
            ("Work Agent 與 Study Agent", "Work Agent 與對應的 Study/Research Agent"),
            ("Work Agent：${JSON.stringify(workResult)}\\nStudy Agent：${JSON.stringify(studyResult)}", "Work Agent：${JSON.stringify(workResult)}\\n專業 Agent：${JSON.stringify(secondResult)}"),
            ("specialists: ['work', 'study']", "specialists: routing.delegatedAgents.filter((id: string) => id !== 'manager')"),
          ])
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src/components/ChatWorkspace.tsx','server/directAgentChat.ts'],check=True)
          subprocess.run(['git','commit','-m','fix: complete research workspace and mixed routing'],check=False)
          subprocess.run(['git','push','origin','HEAD:main'],check=False)
