name: Patch Gemini model

on:
  push:
    paths:
      - .github/workflows/patch-gemini-model.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch model and clean up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/directAgentChat.ts')
          s = p.read_text(encoding='utf-8')
          old = "model: 'gemini-3.7-flash',"
          new = "model: process.env.GEMINI_MODEL || 'gemini-3.5-flash-lite',"
          if old not in s:
              raise SystemExit('expected Gemini model line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-gemini-model.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/directAgentChat.ts .github/workflows/patch-gemini-model.yml
          git commit -m 'fix: use Gemini Flash-Lite for direct agent'
          git push