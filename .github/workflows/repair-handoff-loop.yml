name: repair-handoff-loop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chat handoff loop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AiTeamChat.tsx')
          s = p.read_text()
          s = s.replace("const user: ChatMessage = { id: `direct-user-${Date.now()}`, sender: 'user', text: prompt, timestamp: timeNow() };", "const user: ChatMessage = { id: `direct-user-${Date.now()}`, sender: 'user', text: prompt, timestamp: timeNow(), chatRoomId: roomKey };")
          s = s.replace("const reply: ChatMessage = { id: `direct-agent-${Date.now()}`, sender: 'agent', agentId: data.agentId || selectedAgent.id,", "const reply: ChatMessage = { id: `direct-agent-${Date.now()}`, sender: 'agent', chatRoomId: roomKey, agentId: data.agentId || selectedAgent.id,")
          s = s.replace("const reply: ChatMessage = { id: `direct-error-${Date.now()}`, sender: 'agent', agentId: selectedAgent.id,", "const reply: ChatMessage = { id: `direct-error-${Date.now()}`, sender: 'agent', chatRoomId: roomKey, agentId: selectedAgent.id,")
          marker = "  const append = (items: ChatMessage[]) => setRoomMessages(prev => {"
          insert = """  const refreshRoomFromDb = async () => {\n    try {\n      const r = await fetch(`${apiUrl('/api/persistence/conversations')}?sessionId=${encodeURIComponent(roomKey)}&limit=200`, { headers: { 'X-Owner-Id': 'personal-owner' } });\n      if (!r.ok) return;\n      const data = await r.json();\n      const db = Array.isArray(data.messages) ? data.messages.map(fromDb) : [];\n      const local = loadRooms()[roomKey] || [];\n      const keys = new Set(db.map(messageKey));\n      setRoomMessages(prev => ({ ...prev, [roomKey]: [...db, ...local.filter(m => !keys.has(messageKey(m)))] }));\n    } catch { /* keep current room state */ }\n  };\n\n"""
          if marker in s and 'const refreshRoomFromDb' not in s:
              s = s.replace(marker, insert + marker)
          hook = """  useEffect(() => {\n    const timer = window.setInterval(() => { void refreshRoomFromDb(); }, 8000);\n    return () => window.clearInterval(timer);\n  }, [roomKey]);\n"""
          marker2 = "  const append = (items: ChatMessage[]) => setRoomMessages(prev => {"
          if marker2 in s and 'window.setInterval(() => { void refreshRoomFromDb(); }, 8000)' not in s:
              s = s.replace(marker2, hook + marker2)
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AiTeamChat.tsx
          git diff --cached --quiet || git commit -m "fix: refresh chat rooms with completed agent handoffs"
          git push
