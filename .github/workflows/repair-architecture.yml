name: Repair virtual company architecture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply idempotent architecture repairs
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def patch(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8'); changed=False
              for old,new in pairs:
                  if old in s:
                      s=s.replace(old,new,1); changed=True
              if changed: p.write_text(s,encoding='utf-8')
          patch('server/agentTeam.ts', [
            ("export type AgentId = 'manager' | 'work' | 'study';", "export type AgentId = 'manager' | 'work' | 'study' | 'research';"),
            ("export type AgentIntent = 'work' | 'study' | 'mixed' | 'general';", "export type AgentIntent = 'work' | 'study' | 'research' | 'mixed' | 'general';"),
            ("const STUDY_PATTERNS = [\n  /課業|作業|考試|讀書|學習|研究|論文|教授|課程|複習|lab/i,\n];", "const RESEARCH_PATTERNS = [/論文|文獻|研究方法|研究資料|研究設計|統計分析|資料分析|矩陣分解|碩論|學位論文|paper|literature|methodology/i];\nconst STUDY_PATTERNS = [\n  /課業|作業|考試|讀書|學習|教授|課程|複習|lab/i,\n];"),
            ("  const isWork = matches(WORK_PATTERNS, text);\n  const isStudy = matches(STUDY_PATTERNS, text);", "  const isWork = matches(WORK_PATTERNS, text);\n  const isResearch = matches(RESEARCH_PATTERNS, text);\n  const isStudy = matches(STUDY_PATTERNS, text);"),
            ("  if (isWork && isStudy) {", "  if (isWork && (isStudy || isResearch)) {"),
            ("      delegatedAgents: ['work', 'study'],\n      intent: 'mixed',\n      reason: '同時涉及工作與課業，Manager 需要協調兩個專業 Agent。',", "      delegatedAgents: ['work', ...(isResearch ? ['research'] : ['study'])],\n      intent: 'mixed',\n      reason: isResearch ? '同時涉及工作與研究，Manager 需要協調工作與研究專業 Agent。' : '同時涉及工作與課業，Manager 需要協調兩個專業 Agent。',"),
            ("  if (isWork) {", "  if (isResearch) {\n    return { primaryAgent: 'research', delegatedAgents: ['research'], intent: 'research', reason: '辨識為論文／文獻／研究方法／研究資料分析需求。', requiresDataWrite };\n  }\n\n  if (isWork) {"),
            ("purpose: agentId === 'work' ? '讀取工作 User Data，處理工作專案與任務。' : '讀取課業／研究 User Data，處理學習與研究需求。',", "purpose: agentId === 'work' ? '讀取工作 User Data，處理工作專案與任務。' : agentId === 'research' ? '處理論文、文獻、研究方法與研究資料分析。' : '讀取課業 User Data，處理學習與研究需求。',")])
          patch('server/directAgentChat.ts', [
            ("  study: { name: 'Study Agent', role: '課業管理員', specialty: '課業、研究、複習、考試與學習進度' },", "  study: { name: 'Study Agent', role: '課業管理員', specialty: '課業、複習、考試與學習進度' },\n  research: { name: 'Research Agent', role: '調研分析員', specialty: '論文、文獻檢索、研究方法、研究設計、統計分析與資料驗證' },"),
            ("requestedAgentId === 'work' || requestedAgentId === 'study' ? requestedAgentId : 'manager'", "requestedAgentId === 'work' || requestedAgentId === 'study' || requestedAgentId === 'research' ? requestedAgentId : 'manager'"),
            ("requestedAgentId === 'work' || requestedAgentId === 'study' ? [requestedAgentId] : []", "requestedAgentId === 'work' || requestedAgentId === 'study' || requestedAgentId === 'research' ? [requestedAgentId] : []"),
            ("intent: requestedAgentId === 'work' || requestedAgentId === 'study' ? requestedAgentId : 'general'", "intent: requestedAgentId === 'research' ? 'research' : requestedAgentId === 'work' || requestedAgentId === 'study' ? requestedAgentId : 'general'"),
            ("- Work Agent 只處理工作資料；Study Agent 只處理課業／研究資料。\\n- 混合需求必須由 Work Agent 與 Study Agent 分別分析，再交回 Manager 整合。", "- Work Agent 只處理工作資料；Study Agent 只處理課業資料；Research Agent 專責論文、文獻、研究方法與研究資料分析。\\n- 混合需求必須由各自專業 Agent 分析，再交回 Manager 整合。"),
            ("step.agentId === 'manager' ? 'Manager Agent' : step.agentId === 'work' ? 'Work Agent' : 'Study Agent'", "step.agentId === 'manager' ? 'Manager Agent' : step.agentId === 'work' ? 'Work Agent' : step.agentId === 'research' ? 'Research Agent' : 'Study Agent'"),
            ("agentId === 'work' ? 'Work Agent' : agentId === 'study' ? 'Study Agent' : 'Manager Agent'", "agentId === 'work' ? 'Work Agent' : agentId === 'study' ? 'Study Agent' : agentId === 'research' ? 'Research Agent' : 'Manager Agent'"),
            ("model:'gemini-3.7-flash'", "model:process.env.GEMINI_MODEL||'gemini-3.5-flash-lite'")])
          patch('server/organization.ts', [
            ("const ACTIVE_AGENTS = new Set(['manager','work','study']);", "const ACTIVE_AGENTS = new Set(['manager','work','study','research']);"),
            ("  { id: 'study', name: '學習研究部', headAgent: 'study', description: '課業、研究、學習計畫與進度管理', agentIds: ['study'] },", "  { id: 'study', name: '課業部', headAgent: 'study', description: '課業、複習、考試與學習進度管理', agentIds: ['study'] },\n  { id: 'research', name: '研究部', headAgent: 'research', description: '論文、文獻、研究方法、研究資料與分析管理', agentIds: ['research'] },"),
            ("const profile=handoff.to_agent==='work'?{name:'Work Agent',specialty:'工作專案、任務、截止日、優先級與執行阻礙'}:{name:'Study Agent',specialty:'課業、研究、複習、考試與學習進度'};", "const profile=handoff.to_agent==='work'?{name:'Work Agent',specialty:'工作專案、任務、截止日、優先級與執行阻礙'}:handoff.to_agent==='research'?{name:'Research Agent',specialty:'論文、文獻、研究方法、研究設計、統計分析與資料驗證'}:{name:'Study Agent',specialty:'課業、複習、考試與學習進度'};"),
            ("model:'gemini-3.7-flash'", "model:process.env.GEMINI_MODEL||'gemini-3.5-flash-lite'")])
          p=Path('src/data/agentRegistry.ts'); s=p.read_text(encoding='utf-8'); i=s.index("    id: 'research',"); j=s.index("  },",i)+4; block=s[i:j].replace("status: 'upcoming'","status: 'active'"); p.write_text(s[:i]+block+s[j:],encoding='utf-8')
          patch('src/App.tsx', [("const currentActiveAgents = ['manager', 'work', 'study'];", "const currentActiveAgents = ['manager', 'work', 'study', 'research'];"),("activeAgentsCount={3}","activeAgentsCount={currentActiveAgents.length}")])
          p=Path('src/components/ChatWorkspace.tsx'); s=p.read_text(encoding='utf-8'); s=s.replace("const existingCategory=categories.find(c=>c.id==='research'); if(existingCategory){const existingRoom=rooms.find(r=>r.categoryId==='research');", "const existingCategory=categories.find(c=>c.id==='research'||c.name==='論文研究'||c.id.startsWith('research-')); if(existingCategory){const existingRoom=rooms.find(r=>r.categoryId===existingCategory.id);"); s=s.replace("const categoryId=`research-${Date.now()}`; const roomId=`room-research-${Date.now()}`;", "const categoryId='research'; const roomId=`room-research-${Date.now()}`;"); s=s.replace("agentIds:['manager','study']", "agentIds:['manager','research']",1); s=s.replace("categoryId==='study'||categoryId.startsWith('research-')?'study'", "categoryId==='study'?'study':categoryId==='research'?'research'"); p.write_text(s,encoding='utf-8')
          p=Path('src/components/AiTeamChat.tsx'); s=p.read_text(encoding='utf-8'); s=s.replace("import { Send, Bot, User, Briefcase, GraduationCap, Copy, Check, ShieldCheck, PlusCircle }", "import { Send, Bot, User, Briefcase, GraduationCap, BookOpen, Copy, Check, ShieldCheck, PlusCircle }"); s=s.replace("  { id: 'study', name: 'Study Agent', role: '課業管理員', icon: <GraduationCap className=\"w-3.5 h-3.5\" /> },", "  { id: 'study', name: 'Study Agent', role: '課業管理員', icon: <GraduationCap className=\"w-3.5 h-3.5\" /> },\n  { id: 'research', name: 'Research Agent', role: '調研分析員', icon: <BookOpen className=\"w-3.5 h-3.5\" /> },"); s=s.replace("id === 'study' ? 'Study Agent' : 'Manager Agent'", "id === 'study' ? 'Study Agent' : id === 'research' ? 'Research Agent' : 'Manager Agent'"); s=s.replace("row.agent_id === 'study' ? 'Study Agent' : undefined", "row.agent_id === 'study' ? 'Study Agent' : row.agent_id === 'research' ? 'Research Agent' : undefined"); s=s.replace("row.agent_id === 'study' ? '課業管理員' : undefined", "row.agent_id === 'study' ? '課業管理員' : row.agent_id === 'research' ? '調研分析員' : undefined"); p.write_text(s,encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True); subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','server/agentTeam.ts','server/directAgentChat.ts','server/organization.ts','src/data/agentRegistry.ts','src/App.tsx','src/components/ChatWorkspace.tsx','src/components/AiTeamChat.tsx'],check=True)
          subprocess.run(['git','commit','-m','fix: activate research department and repair agent routing'],check=False)
          subprocess.run(['git','push','origin','HEAD:main'],check=False)
          # Remove the temporary repair workflow in a separate contents commit later; keeping it prevents accidental reapplication.
